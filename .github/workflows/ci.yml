# 型チェック・テスト・ビルドの自動確認のみを行うワークフロー。
# GitHub Pages への公開（デプロイ）は一切行わない。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 依存関係のインストール
        run: .github/scripts/run-step.sh install npm install --no-audit --no-fund

      - name: 使用バージョンの記録
        run: echo "::notice title=versions::node $(node -v) / $(npm ls --depth=0 2>/dev/null | tail -n +2 | tr '\n' ' ')"

      - name: 型チェック
        run: .github/scripts/run-step.sh typecheck npm run typecheck

      - name: テスト（Vitest）
        run: .github/scripts/run-step.sh test npm test

      - name: ビルド（通常）
        run: .github/scripts/run-step.sh build npm run build

      - name: ビルド（GitHub Pages 用 base パス）
        run: .github/scripts/run-step.sh build-pages npm run build:pages

      - name: Pages 用ビルドの base パス確認
        run: grep -q '/mirtill-monsters-battle-card/static/' dist/index.html
